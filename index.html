<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="description" content="Gym Progress - registra allenamenti e progressi in palestra"><link rel="manifest" href="manifest.webmanifest"><title>Gym Progress</title>
<style>
:root{--bg:#0d141b;--panel:#151f29;--panel2:#1b2935;--text:#f3f6f8;--muted:#9aabb8;--line:#2a3946;--accent:#a3e635;--accent2:#d9f99d;--red:#fb7185;--blue:#7dd3fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#14200a;font-weight:750;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#512632;color:#ffdce2}button.small{padding:7px 10px;font-size:13px}.app{max-width:850px;margin:auto;padding:0 14px 90px}.top{position:sticky;top:0;z-index:5;background:#0d141beF;padding:15px 0 12px;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:20px;margin:0;letter-spacing:.3px}.brand span{color:var(--accent);font-size:11px;letter-spacing:1.5px;font-weight:800}.tabs{display:flex;gap:7px;margin-top:13px;overflow:auto}.tab{white-space:nowrap;background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 12px}.tab.active{background:var(--accent);color:#14200a;border-color:var(--accent)}main{padding-top:17px}.hero{background:linear-gradient(130deg,#1d303d,#17222d);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:15px}.hero .eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:1.2px}.hero h2{font-size:26px;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:23px;display:block}.stat small{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}.section-head h2{font-size:18px;margin:0}.stack{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.pill{font-size:11px;border-radius:999px;padding:5px 8px;background:#293a45;color:var(--accent2)}.exercise-title{font-weight:750}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0f1820;color:var(--text);padding:11px;min-width:0}textarea{min-height:76px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:24px;text-align:center;border:1px dashed #42515e;border-radius:15px;color:var(--muted)}.media{width:100%;max-height:230px;object-fit:contain;background:#0b1117;border-radius:12px;margin-top:9px}.setrow{display:grid;grid-template-columns:35px 1fr 1fr 1fr 1fr;gap:6px;align-items:center;margin:7px 0}.setrow input{padding:9px 6px;text-align:center}.setrow label{font-size:11px;color:var(--muted);text-align:center}.sethead{display:grid;grid-template-columns:35px 1fr 1fr 1fr 1fr;gap:6px}.sethead span{text-align:center;font-size:10px;color:var(--muted)}.check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.check input{width:auto}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);line-height:1.5}.bottomnote{position:fixed;bottom:0;left:0;right:0;background:#0d141bf2;border-top:1px solid var(--line);padding:10px 15px calc(10px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:11px}.bar{height:8px;background:#293742;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.link{color:var(--blue);text-decoration:underline;cursor:pointer;background:none;padding:0}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 14px 14px;width:min(100%,650px);max-height:90vh;overflow:auto;padding:17px}.modalbox h2{margin:0 0 14px}.close{background:var(--panel2);color:var(--text)}@media(min-width:650px){.modal{align-items:center}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div><span>IL TUO DIARIO DI ALLENAMENTO</span><h1>GYM <span style="color:var(--accent)">PROGRESS</span></h1></div><button class="secondary small" id="backupBtn">Backup</button></div><nav class="tabs" id="tabs"><button class="tab active" data-page="home">Panoramica</button><button class="tab" data-page="plans">Le mie giornate</button><button class="tab" data-page="library">Esercizi</button><button class="tab" data-page="history">Storico</button><button class="tab" data-page="reports">Report</button></nav></header><main id="main"></main></div><div class="bottomnote">I dati restano su questo dispositivo. Esporta regolarmente un backup.</div><div id="modalRoot"></div>
<script>
const KEY='gymprogress_v1';let state=load();let page='home';let activeWorkout=null;let draftSets=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{days:[],exercises:[],sessions:[],body:[]}}catch(e){return{days:[],exercises:[],sessions:[],body:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}function ex(id){return state.exercises.find(x=>x.id===id)}function day(id){return state.days.find(x=>x.id===id)}function pageTo(p){page=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)pageTo(b.dataset.page)});document.getElementById('backupBtn').onclick=backup;
function render(){let m=document.getElementById('main');if(page==='home')m.innerHTML=home();if(page==='plans')m.innerHTML=plans();if(page==='library')m.innerHTML=library();if(page==='history')m.innerHTML=history();if(page==='reports')m.innerHTML=reports();}
function home(){let last=state.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date))[0],month=new Date().toISOString().slice(0,7),count=state.sessions.filter(s=>s.date.startsWith(month)).length;return `<section class="hero"><div class="eyebrow">BENVENUTO IN PALESTRA</div><h2>Costruisci i tuoi progressi.</h2><p class="muted">Crea le tue giornate, registra ogni serie e controlla i miglioramenti nel tempo.</p><div class="actions"><button onclick="pageTo('plans')">+ Crea giornata</button><button class="secondary" onclick="pageTo('library')">+ Aggiungi esercizio</button></div></section><div class="grid"><div class="stat"><b>${state.days.length}</b><small>Giornate create</small></div><div class="stat"><b>${state.exercises.length}</b><small>Esercizi in archivio</small></div><div class="stat"><b>${count}</b><small>Allenamenti questo mese</small></div><div class="stat"><b>${state.sessions.length}</b><small>Allenamenti totali</small></div></div><div class="section-head"><h2>Riprendi da dove eri rimasto</h2></div>${last?`<div class="card"><div class="row"><b>${esc(last.dayName)}</b><span class="pill">${fmt(last.date)}</span></div><p class="muted">${last.entries.length} esercizi registrati</p><button class="secondary" onclick="showSession('${last.id}')">Apri allenamento</button></div>`:`<div class="empty">Non hai ancora registrato allenamenti. Crea una giornata e inizia il tuo primo workout.</div>`}<div class="section-head"><h2>Accesso rapido</h2></div><div class="stack">${state.days.length?state.days.map(d=>`<div class="card row"><div><b>${esc(d.name)}</b><div class="muted" style="font-size:12px">${d.exerciseIds.length} esercizi</div></div><button class="small" onclick="startWorkout('${d.id}')">Inizia</button></div>`).join(''):'<div class="notice">Le giornate che creerai compariranno qui.</div>'}</div>`}
function plans(){return `<div class="section-head"><h2>Le mie giornate</h2><button onclick="dayForm()">+ Nuova giornata</button></div><p class="notice">Organizza liberamente i tuoi allenamenti: non esiste una suddivisione obbligatoria.</p>${state.days.length?`<div class="stack">${state.days.map(d=>`<div class="card"><div class="row"><div><b>${esc(d.name)}</b><div class="muted" style="font-size:12px">${d.exerciseIds.length} esercizi</div></div><span class="pill">Scheda</span></div><div class="actions"><button class="small" onclick="startWorkout('${d.id}')">Inizia allenamento</button><button class="secondary small" onclick="editDay('${d.id}')">Modifica</button><button class="danger small" onclick="deleteDay('${d.id}')">Elimina</button></div><div class="notice" style="margin-top:9px">${d.exerciseIds.map(x=>esc(ex(x)?.name||'Esercizio eliminato')).join(' · ')||'Nessun esercizio aggiunto'}</div></div>`).join('')}</div>`:'<div class="empty">Non hai ancora giornate. Premi “Nuova giornata” per creare la prima.</div>'}`}
function library(){let cards=state.exercises.map(x=>exerciseCard(x)).join('');return `<div class="section-head"><h2>Archivio esercizi</h2><button onclick="exerciseForm()">+ Nuovo esercizio</button></div><p class="notice">Aggiungi una foto o un video dimostrativo dal telefono e scrivi le istruzioni in italiano.</p>${state.exercises.length?`<div class="stack">${cards}</div>`:`<div class="empty">L'archivio è vuoto. Aggiungi il primo esercizio: potrai allegare foto, video e spiegazioni.</div>`}`}
function exerciseCard(x){let photo=x.photo?`<img class="media" src="${x.photo}" alt="${esc(x.name)}">`:'';let video=x.video?`<video class="media" src="${x.video}" controls playsinline></video>`:'';return `<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill">${esc(x.muscle||'Altro')}</span></div>${photo}${video}<p class="muted" style="font-size:13px">${esc(x.instructions||'Nessuna spiegazione inserita.')}</p><div class="actions"><button class="secondary small" onclick="exerciseForm('${x.id}')">Modifica</button><button class="danger small" onclick="deleteExercise('${x.id}')">Elimina</button></div></div>`}
function history(){let sessions=state.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="section-head"><h2>Storico allenamenti</h2><span class="pill">${sessions.length} sessioni</span></div>${sessions.length?`<div class="stack">${sessions.map(s=>`<div class="card"><div class="row"><b>${esc(s.dayName)}</b><span class="muted" style="font-size:12px">${fmt(s.date)}</span></div><p class="muted" style="font-size:13px">${s.entries.length} esercizi · ${s.entries.reduce((n,e)=>n+e.sets.length,0)} serie registrate</p><div class="actions"><button class="secondary small" onclick="showSession('${s.id}')">Dettagli</button><button class="danger small" onclick="deleteSession('${s.id}')">Elimina</button></div></div>`).join('')}</div>`:'<div class="empty">Gli allenamenti completati appariranno qui.</div>'}`}
function reports(){let now=new Date(),month=now.toISOString().slice(0,7),ss=state.sessions.filter(s=>s.date.startsWith(month)),sets=ss.flatMap(s=>s.entries.flatMap(e=>e.sets)),volume=sets.reduce((n,s)=>n+(+s.kg||0)*(+s.reps||0),0),fail=sets.filter(s=>s.failure).length;let months={};state.sessions.forEach(s=>{let k=s.date.slice(0,7);months[k]=(months[k]||0)+1});let rows=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);return `<div class="section-head"><h2>Report mensile</h2><span class="pill">${now.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</span></div><div class="grid"><div class="stat"><b>${ss.length}</b><small>Allenamenti</small></div><div class="stat"><b>${sets.length}</b><small>Serie registrate</small></div><div class="stat"><b>${Math.round(volume).toLocaleString('it-IT')} kg</b><small>Volume (kg × rip.)</small></div><div class="stat"><b>${fail}</b><small>Serie a cedimento</small></div></div><div class="section-head"><h2>Andamento degli ultimi mesi</h2></div>${rows.length?`<div class="card stack">${rows.map(([k,v])=>`<div><div class="row"><span>${new Date(k+'-02').toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</span><b>${v}</b></div><div class="bar"><i style="width:${Math.min(100,v/Math.max(...rows.map(r=>r[1]))*100)}%"></i></div></div>`).join('')}</div>`:'<div class="empty">Non ci sono ancora dati sufficienti per i report.</div>'}<div class="section-head"><h2>Peso corporeo</h2><button class="secondary small" onclick="bodyForm()">+ Registra peso</button></div>${state.body.length?`<div class="card">${state.body.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(b=>`<div class="row" style="padding:5px 0"><span>${fmt(b.date)}</span><b>${b.kg} kg</b></div>`).join('')}</div>`:'<div class="notice">Puoi registrare il peso corporeo per seguire anche questo andamento.</div>'}<div class="actions"><button onclick="exportReport()">Esporta report CSV</button></div>`}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="row"><h2>${title}</h2><button class="close small" onclick="closeModal()">Chiudi</button></div>${body}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function dayForm(){modal('Crea giornata',`<div class="field"><label>Nome della giornata</label><input id="dayName" placeholder="Es. Upper 1, Gambe, Fullbody..."></div><div class="actions"><button onclick="saveDay()">Salva giornata</button></div>`)}function saveDay(){let n=document.getElementById('dayName').value.trim();if(!n)return alert('Inserisci un nome.');state.days.push({id:id(),name:n,exerciseIds:[]});save();closeModal();render()}function editDay(i){let d=day(i);modal('Modifica giornata',`<div class="field"><label>Nome</label><input id="dayName" value="${esc(d.name)}"></div><div class="field" style="margin-top:12px"><label>Aggiungi esercizi dall’archivio</label><div class="stack">${state.exercises.map(x=>`<label class="check"><input type="checkbox" value="${x.id}" ${d.exerciseIds.includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')||'<span class="muted">Prima crea esercizi nell’archivio.</span>'}</div></div><div class="actions"><button onclick="updateDay('${i}')">Salva modifiche</button></div>`)}function updateDay(i){let d=day(i);d.name=document.getElementById('dayName').value.trim()||d.name;d.exerciseIds=[...document.querySelectorAll('#modalRoot input[type=checkbox]:checked')].map(x=>x.value);save();closeModal();render()}function deleteDay(i){if(confirm('Eliminare questa giornata? Gli allenamenti già registrati resteranno nello storico.')){state.days=state.days.filter(d=>d.id!==i);save();render()}}
function exerciseForm(i){let x=i?ex(i):{name:'',muscle:'',instructions:'',photo:'',video:''};modal(i?'Modifica esercizio':'Nuovo esercizio',`<div class="formgrid"><div class="field full"><label>Nome esercizio</label><input id="exName" value="${esc(x.name)}" placeholder="Es. Panca piana con bilanciere"></div><div class="field full"><label>Gruppo muscolare</label><input id="exMuscle" value="${esc(x.muscle)}" placeholder="Es. Petto"></div><div class="field full"><label>Spiegazione in italiano</label><textarea id="exInstructions" placeholder="Posizione iniziale, esecuzione, respirazione, errori da evitare...">${esc(x.instructions)}</textarea></div><div class="field full"><label>Foto / illustrazione (dal telefono)</label><input id="exPhoto" type="file" accept="image/*"></div><div class="field full"><label>Video dimostrativo (dal telefono)</label><input id="exVideo" type="file" accept="video/*"></div></div><p class="notice">Nota: in questa prima versione i media vengono salvati nel browser del dispositivo. Video molto grandi possono occupare parecchio spazio.</p><div class="actions"><button onclick="saveExercise('${i||''}')">Salva esercizio</button></div>`)}function fileData(f){return new Promise((res,rej)=>{if(!f)return res(null);let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}async function saveExercise(i){let name=document.getElementById('exName').value.trim();if(!name)return alert('Inserisci il nome dell’esercizio.');let old=i?ex(i):{};let p=document.getElementById('exPhoto').files[0],v=document.getElementById('exVideo').files[0];let photo=await fileData(p)||old.photo||'',video=await fileData(v)||old.video||'';let obj={id:i||id(),name,muscle:document.getElementById('exMuscle').value.trim(),instructions:document.getElementById('exInstructions').value.trim(),photo,video};if(i)state.exercises=state.exercises.map(a=>a.id===i?obj:a);else state.exercises.push(obj);save();closeModal();render()}function deleteExercise(i){if(confirm('Eliminare l’esercizio dall’archivio? Le sessioni già salvate non verranno cancellate.')){state.exercises=state.exercises.filter(x=>x.id!==i);state.days.forEach(d=>d.exerciseIds=d.exerciseIds.filter(x=>x!==i));save();render()}}
function startWorkout(di){let d=day(di);if(!d)return;activeWorkout={dayId:di,dayName:d.name,entries:[],date:new Date().toISOString().slice(0,10)};let ids=d.exerciseIds.slice();if(!ids.length){let chosen=state.exercises.map(x=>x.id);if(!chosen.length)return alert('Aggiungi prima almeno un esercizio nell’archivio.');activeWorkout.exerciseIds=chosen}else activeWorkout.exerciseIds=ids;workoutStep(0)}function workoutStep(idx){let ids=activeWorkout.exerciseIds;if(idx>=ids.length)return finishWorkout();let x=ex(ids[idx]);if(!x){workoutStep(idx+1);return}let prev=state.sessions.slice().reverse().flatMap(s=>s.entries).find(e=>e.exerciseId===x.id);let sets=[{kg:'',reps:'',rir:'',failure:false}];let body=`<div class="row"><span class="pill">Esercizio ${idx+1} di ${ids.length}</span><span class="muted" style="font-size:12px">${esc(x.muscle)}</span></div><h3>${esc(x.name)}</h3>${x.photo?`<img class="media" src="${x.photo}">`:''}${x.video?`<video class="media" src="${x.video}" controls playsinline></video>`:''}<p class="muted">${esc(x.instructions||'Nessuna spiegazione disponibile.')}</p>${prev?`<div class="notice">Ultima volta: ${prev.sets.map(s=>`${s.kg} kg × ${s.reps}`).join(' · ')}</div>`:''}<div class="section-head"><h3>Serie</h3><button class="secondary small" onclick="addSetRow()">+ Serie</button></div><div class="sethead"><span>#</span><span>Kg</span><span>Rip.</span><span>RIR</span><span>Cedimento</span></div><div id="setsArea">${setRow(0,sets[0])}</div><div class="actions"><button class="secondary" onclick="cancelWorkout()">Annulla</button><button onclick="saveExerciseEntry('${x.id}',${idx})">Salva esercizio</button></div>`;modal('Registra allenamento',body);draftSets=sets}
function setRow(i,s){return `<div class="setrow"><b>${i+1}</b><input type="number" step="0.5" min="0" placeholder="kg" value="${s.kg}" data-k="kg"><input type="number" min="0" placeholder="rip." value="${s.reps}" data-k="reps"><input type="number" min="0" max="10" placeholder="RIR" value="${s.rir}" data-k="rir"><label class="check"><input type="checkbox" data-k="failure" ${s.failure?'checked':''}> Sì</label></div>`}function addSetRow(){let a=document.getElementById('setsArea');let i=a.children.length;a.insertAdjacentHTML('beforeend',setRow(i,{kg:'',reps:'',rir:'',failure:false}))}function saveExerciseEntry(eid,idx){let rows=[...document.querySelectorAll('#setsArea .setrow')];let sets=rows.map(r=>({kg:r.querySelector('[data-k=kg]').value,reps:r.querySelector('[data-k=reps]').value,rir:r.querySelector('[data-k=rir]').value,failure:r.querySelector('[data-k=failure]').checked})).filter(s=>s.kg!==''||s.reps!=='');if(!sets.length)return alert('Registra almeno una serie.');activeWorkout.entries.push({exerciseId:eid,exerciseName:ex(eid).name,sets});closeModal();workoutStep(idx+1)}function cancelWorkout(){if(confirm('Annullare l’allenamento non ancora salvato?')){activeWorkout=null;closeModal()}}function finishWorkout(){let date=prompt('Data allenamento (AAAA-MM-GG)',activeWorkout.date);if(!date){activeWorkout=null;closeModal();return}state.sessions.push({id:id(),date,dayId:activeWorkout.dayId,dayName:activeWorkout.dayName,entries:activeWorkout.entries});save();activeWorkout=null;closeModal();pageTo('history');alert('Allenamento salvato!')}function showSession(i){let s=state.sessions.find(x=>x.id===i);modal(esc(s.dayName),`<p class="muted">${fmt(s.date)}</p>${s.entries.map(e=>`<div class="card" style="margin:8px 0"><b>${esc(e.exerciseName)}</b><p class="muted" style="font-size:13px">${e.sets.map((x,j)=>`Serie ${j+1}: ${x.kg} kg × ${x.reps} · RIR ${x.rir||'—'} ${x.failure?'· Cedimento':''}`).join('<br>')}</p></div>`).join('')}`)}function deleteSession(i){if(confirm('Eliminare questo allenamento dallo storico?')){state.sessions=state.sessions.filter(s=>s.id!==i);save();render()}}
function bodyForm(){modal('Registra peso corporeo',`<div class="formgrid"><div class="field"><label>Peso (kg)</label><input id="bodyKg" type="number" step="0.1" placeholder="Es. 63.2"></div><div class="field"><label>Data</label><input id="bodyDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="actions"><button onclick="saveBody()">Salva</button></div>`)}function saveBody(){let kg=+document.getElementById('bodyKg').value;if(!kg)return alert('Inserisci un peso valido.');state.body.push({kg,date:document.getElementById('bodyDate').value});save();closeModal();render()}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,'gym-progress-backup-'+new Date().toISOString().slice(0,10)+'.json')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportReport(){let lines=[['Data','Giornata','Esercizio','Serie','Kg','Ripetizioni','RIR','Cedimento']];state.sessions.forEach(s=>s.entries.forEach(e=>e.sets.forEach((x,i)=>lines.push([s.date,s.dayName,e.exerciseName,i+1,x.kg,x.reps,x.rir,x.failure?'Sì':'No']))));let csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'gym-progress-report.csv')}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
